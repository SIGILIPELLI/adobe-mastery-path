site_name: Adobe Creative Cloud Mastery Path
site_description: A structured, module-wise Adobe Creative Cloud training program from entry level to master level, covering Photoshop, Illustrator, Premiere Pro, and After Effects workflows.
site_url: https://sigilipelli.github.io/adobe-mastery-path/
repo_url: https://github.com/SIGILIPELLI/adobe-mastery-path
repo_name: adobe-mastery-path

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Privacy Policy: privacy-policy.md
  - "Level 1 · Entry":
      - Overview: level-1/index.md
      - "01 · Creative Cloud Setup, Libraries & Sync": level-1/01-setup-libraries-sync.md
      - "02 · Photoshop Basics": level-1/02-photoshop-basics.md
      - "03 · Illustrator Basics": level-1/03-illustrator-basics.md
      - "04 · Premiere Pro Basics": level-1/04-premiere-basics.md
      - "05 · After Effects Basics": level-1/05-after-effects-basics.md
      - "06 · Photoshop Compositing & Retouching": level-1/06-photoshop-compositing-retouching.md
      - "07 · Illustrator Vector Workflows": level-1/07-illustrator-vector-workflows.md
      - "08 · Premiere Editing Workflow": level-1/08-premiere-editing-workflow.md
      - "09 · Cross-App Creative Cloud Libraries Workflow": level-1/09-cross-app-libraries-workflow.md
      - "10 · Capstone Project — Brand Kit": level-1/10-capstone-brand-kit.md
  - "Level 2 · Intermediate":
      - Overview: level-2/index.md
      - "01 · Advanced Layers & Smart Objects (Photoshop)": level-2/01-advanced-layers-smart-objects.md
      - "02 · Photoshop Color Correction & Grading": level-2/02-photoshop-color-correction.md
      - "03 · Illustrator Advanced Typography": level-2/03-illustrator-advanced-typography.md
      - "04 · Illustrator Gradients, Meshes & Effects": level-2/04-illustrator-gradients-meshes.md
      - "05 · Premiere Multi-Cam Editing": level-2/05-premiere-multicam-editing.md
      - "06 · Premiere Audio Mixing & Sound Design": level-2/06-premiere-audio-mixing.md
      - "07 · Photoshop Automation (Actions & Batch Processing)": level-2/07-photoshop-automation-actions.md
      - "08 · Illustrator Pattern & Asset Libraries": level-2/08-illustrator-pattern-libraries.md
      - "09 · Premiere Titles & Essential Graphics": level-2/09-premiere-titles-essential-graphics.md
      - "10 · Project — Multi-App Marketing Campaign": level-2/10-project-marketing-campaign.md
# --- auto-pruned stub levels (see AdSense low-value-content fix) ---
exclude_docs: |
  level-3/*.md
  level-4/*.md
